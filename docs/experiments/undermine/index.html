<title>Undermine</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Layout: one canvas for the shaft, a slim HUD on top, thumb controls at the bottom on touch screens, and card overlays for menus. Always dark: it's underground. */
:root {
  --bg: #120d0b;
  --soil: #2a1c14;
  --cream: #fff4dc;
  --muted: rgba(255, 244, 220, .62);
  --amber: #ffd25a;
  --amber-deep: #e09a2b;
  --worm: #e2474b;
  --good: #7fe08a;
  --bad: #ff7a8a;
  --rune: #b9a4ff;
  --glass: rgba(18, 13, 11, .66);
  --line: rgba(255, 244, 220, .14);
  --display: "Lilita One", "Arial Black", Impact, sans-serif;
  --body: "Nunito", ui-rounded, "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
[hidden] { display: none !important; }
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg); color: var(--cream);
  font-family: var(--body); font-weight: 800;
  overflow: hidden; overscroll-behavior: none;
  -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
}
#app { position: fixed; inset: 0; overflow: hidden; }
#cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
button { font: inherit; color: inherit; }
button:focus-visible, a:focus-visible { outline: 3px solid var(--amber); outline-offset: 2px; }

/* ---------- HUD ---------- */
#hud {
  position: absolute; top: 0; left: 0; right: 0; width: min(100%, 680px); margin: 0 auto; pointer-events: none;
  padding: max(10px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right)) 0 max(12px, env(safe-area-inset-left));
  display: grid; gap: 6px;
}
#hud .row { display: flex; align-items: center; gap: 8px; }
#hud button { pointer-events: auto; }
.pill { height: 38px; display: flex; align-items: center; gap: 6px; padding: 0 12px; border-radius: 999px; background: var(--glass); border: 1px solid var(--line); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); white-space: nowrap; }
.prog { flex: 1; min-width: 0; padding: 0 12px 0 8px; gap: 10px; }
.prog .mine { font-family: var(--display); font-size: 15px; width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; background: var(--amber); color: #3a1f06; flex: none; }
.prog .bar { flex: 1; height: 10px; border-radius: 99px; background: rgba(255,255,255,.1); position: relative; min-width: 40px; }
.prog .fill { height: 100%; width: 0; border-radius: 99px; background: linear-gradient(90deg, #e09a2b, #ffd25a); }
.prog .goal { position: absolute; right: -8px; top: 50%; width: 26px; height: 26px; transform: translateY(-55%); }
.depth { font-family: var(--display); font-size: 20px; line-height: 1; font-variant-numeric: tabular-nums; min-width: 3ch; text-align: right; }
.depth small { font-size: 13px; color: var(--muted); margin-left: 1px; }
.icons { display: flex; align-items: center; gap: 2px; }
.icons img { width: 20px; height: 20px; display: block; }
.count { font-family: var(--display); font-size: 17px; font-variant-numeric: tabular-nums; }
.round { width: 38px; height: 38px; flex: none; display: grid; place-items: center; padding: 0; border-radius: 50%; background: var(--glass); border: 1px solid var(--line); cursor: pointer; }
.round svg { width: 18px; height: 18px; }
.meter { flex: 1; height: 26px; min-width: 0; display: flex; align-items: center; gap: 8px; padding: 0 10px 0 6px; border-radius: 999px; background: var(--glass); border: 1px solid var(--line); transition: opacity .3s; }
.meter img { width: 20px; height: 20px; }
.meter .bar { flex: 1; height: 8px; border-radius: 99px; background: rgba(255,255,255,.1); overflow: hidden; }
.meter .fill { height: 100%; width: 100%; border-radius: 99px; background: var(--good); transform-origin: left; transition: background .3s; }
.meter.close { border-color: rgba(226, 71, 75, .8); animation: throb .5s ease-in-out infinite alternate; }
@keyframes throb { to { box-shadow: 0 0 0 3px rgba(226,71,75,.35); } }
.hearts { height: 26px; display: flex; align-items: center; padding: 0 7px; border-radius: 999px; background: var(--glass); border: 1px solid var(--line); flex: none; }
.hearts img { width: 18px; height: 18px; }
#hSw { height: 38px; padding: 0 12px 0 8px; }
#hSw img { width: 24px; height: 24px; }
#hSw .count { font-size: 22px; min-width: 2.2ch; }
#hSw .fill { background: linear-gradient(90deg, #e09a2b, #ffd25a); }
#hSw.low { border-color: rgba(226, 71, 75, .8); animation: throb .5s ease-in-out infinite alternate; }
#hSw.low .count { color: #ff9a9a; }
.bombbtn { pointer-events: auto; height: 46px; display: flex; align-items: center; gap: 4px; padding: 0 12px 0 8px; border-radius: 999px; background: var(--glass); border: 2px solid var(--line); cursor: pointer; font-family: var(--display); font-size: 20px; }
.bombbtn img { width: 30px; height: 30px; }
.bombbtn.armed { border-color: #ff8a5a; background: rgba(255,120,80,.25); box-shadow: 0 0 0 4px rgba(255,120,80,.25); }
.fx { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; background: var(--glass); border: 2px solid var(--line); position: relative; }
.fx img { width: 20px; height: 20px; }
.fx.good { border-color: var(--good); } .fx.bad { border-color: var(--bad); }
@media (max-width: 480px) {
  .depth { font-size: 17px; }
  .pill { padding: 0 9px; height: 34px; }
  .round { width: 34px; height: 34px; }
  #hud .row { gap: 6px; }
  .icons img { width: 17px; height: 17px; }
}

/* ---------- banner ---------- */
#banner { position: absolute; left: 50%; top: 34%; transform: translate(-50%, -50%); text-align: center; pointer-events: none; opacity: 0; width: min(92vw, 560px); }
#banner.show { animation: banner 2.2s cubic-bezier(.2,.8,.2,1) forwards; }
@keyframes banner { 0% { opacity: 0; transform: translate(-50%, -38%) scale(.94); } 12% { opacity: 1; transform: translate(-50%, -50%) scale(1); } 80% { opacity: 1; transform: translate(-50%, -50%); } 100% { opacity: 0; transform: translate(-50%, -60%); } }
#banner .k { font-size: 13px; letter-spacing: .32em; text-transform: uppercase; color: var(--amber); text-shadow: 0 2px 8px #000; }
#banner .n { font-family: var(--display); font-size: clamp(36px, 10vw, 60px); line-height: 1.02; text-shadow: 0 4px 0 #000, 0 10px 30px rgba(0,0,0,.6); margin-top: 4px; }
#banner .h { font-size: 15px; line-height: 1.4; color: var(--cream); text-shadow: 0 2px 6px #000; margin-top: 8px; }
#banner.danger .n { color: #ffb0b0; } #banner.danger .k { color: var(--bad); }

/* ---------- overlays ---------- */
.overlay { position: absolute; inset: 0; display: grid; place-items: center; padding: 20px max(16px, env(safe-area-inset-right)) 20px max(16px, env(safe-area-inset-left)); background: radial-gradient(ellipse at 50% 40%, rgba(18,13,11,.55), rgba(8,5,4,.92)); overflow-y: auto; }
.card { width: min(100%, 440px); display: grid; gap: 16px; justify-items: center; text-align: center; }
.logo { font-family: var(--display); font-size: clamp(54px, 15vw, 92px); line-height: .9; letter-spacing: .01em; color: var(--amber); text-shadow: 0 5px 0 #6b3d10, 0 14px 40px rgba(0,0,0,.6); margin: 0; }
.tag { font-size: 19px; line-height: 1.4; color: var(--cream); margin: 0; max-width: 24ch; }
.steer { display: flex; align-items: center; gap: 12px; font-size: 15px; line-height: 1.4; color: var(--muted); }
.steer img { width: 34px; height: 34px; animation: nudge 1s ease-in-out infinite alternate; }
.steer img.flip { transform: scaleX(-1); animation-name: nudgeR; }
@keyframes nudge { to { transform: translateX(-5px); } }
@keyframes nudgeR { from { transform: scaleX(-1); } to { transform: scaleX(-1) translateX(-5px); } }
.big { font-family: var(--display); font-size: 26px; letter-spacing: .02em; padding: 14px 48px; border-radius: 16px; border: 0; cursor: pointer; background: linear-gradient(#ffd25a, #e09a2b); color: #3a1f06; box-shadow: 0 5px 0 #8a4f12, 0 14px 30px rgba(0,0,0,.4); transition: transform .08s; }
.big:active { transform: translateY(3px); box-shadow: 0 2px 0 #8a4f12; }
.big.ghost { background: rgba(255,244,220,.08); color: var(--cream); box-shadow: inset 0 0 0 2px var(--line); font-size: 18px; padding: 11px 26px; }
.lnk { font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); text-decoration: none; background: none; border: 0; cursor: pointer; padding: 6px; }
.lnk:hover { color: var(--cream); }
#loading { font-size: 14px; color: var(--muted); }
.grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; width: 100%; }
.mb { aspect-ratio: 1; border-radius: 14px; border: 2px solid var(--line); background: rgba(255,244,220,.06); cursor: pointer; display: grid; place-items: center; align-content: center; gap: 2px; padding: 4px 0; }
.mb b { font-family: var(--display); font-weight: 400; font-size: 24px; line-height: 1; }
.mb .st { display: flex; gap: 1px; } .mb .st img { width: 13px; height: 13px; }
.mb.next { border-color: var(--amber); box-shadow: 0 0 0 3px rgba(255,210,90,.2); }
.mb:disabled { opacity: .35; cursor: default; }
.sh { font-family: var(--display); font-size: clamp(32px, 7vw, 46px); line-height: 1; margin: 0; }
.mk { font-size: 13px; letter-spacing: .3em; text-transform: uppercase; color: var(--amber); margin: 0; }
.cause { font-family: var(--display); font-size: clamp(46px, 12vw, 72px); line-height: .95; color: var(--worm); text-shadow: 0 5px 0 #4a0c14, 0 14px 40px rgba(0,0,0,.6); margin: 0; }
.cause.win { color: var(--amber); text-shadow: 0 5px 0 #6b3d10, 0 14px 40px rgba(0,0,0,.6); }
.stars { display: flex; gap: 10px; }
.stars img { width: 64px; height: 64px; opacity: 0; transform: scale(.3); }
.stars img.pop { animation: pop .45s cubic-bezier(.2,1.6,.4,1) forwards; }
@keyframes pop { to { opacity: 1; transform: none; } }
.starrows { display: grid; gap: 6px; width: 100%; max-width: 300px; }
.starrows div { display: flex; align-items: center; gap: 10px; font-size: 15px; color: var(--muted); text-align: left; }
.starrows img { width: 22px; height: 22px; flex: none; }
.starrows .on { color: var(--cream); }
.earn { display: flex; align-items: center; gap: 6px; font-family: var(--display); font-size: 30px; margin: 0; }
.earn img { width: 30px; height: 30px; }
.earn small { font-family: var(--body); font-size: 14px; color: var(--muted); margin-left: 4px; }
.shopbtn { display: inline-flex; align-items: center; gap: 6px; }
.shopbtn img { width: 22px; height: 22px; }
.shopbtn.can { box-shadow: inset 0 0 0 2px var(--good); }
.ups { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; width: 100%; }
.up { display: grid; justify-items: center; gap: 4px; padding: 12px 8px 10px; border-radius: 16px; border: 2px solid var(--line); background: rgba(255,244,220,.06); cursor: pointer; }
.up > img { width: 44px; height: 44px; }
.up b { font-family: var(--display); font-weight: 400; font-size: 20px; line-height: 1; }
.up .now { font-size: 13px; color: var(--muted); }
.up .lv { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--amber); } .up .lv small { color: var(--muted); font-size: 12px; }
.up .price { display: flex; align-items: center; gap: 4px; font-family: var(--display); font-size: 18px; margin-top: 2px; }
.up .price img { width: 18px; height: 18px; }
.up.can { border-color: var(--good); }
.up:not(.can) .price { opacity: .5; }
.up:disabled { opacity: .55; cursor: default; }
.up.bought { animation: bought .35s ease-out; }
@keyframes bought { 40% { transform: scale(1.06); } }
.row2 { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
.coarse .keys { display: none; }
@media (prefers-reduced-motion: reduce) {
  .stars img.pop { animation-duration: .01s; }
  .steer img { animation: none; }
}
</style>
</head>
<body>
<div id="app">
  <canvas id="cv" aria-label="Undermine playfield"></canvas>

  <div id="hud" hidden>
    <div class="row">
      <button class="round" id="btnPause" aria-label="Pause"><svg viewBox="0 0 20 20" fill="currentColor"><rect x="4.5" y="3.5" width="4" height="13" rx="1.4"/><rect x="11.5" y="3.5" width="4" height="13" rx="1.4"/></svg></button>
      <div class="pill prog"><span class="mine" id="hMine">1</span><div class="bar"><div class="fill" id="hProg"></div><img alt="" data-s="chest" class="goal"></div><span class="depth" id="hDepth">0<small>m</small></span></div>
      <div class="pill" title="Gems"><span class="icons"><img alt="" data-s="i_gem"></span><span class="count" id="hGems">0</span></div>
    </div>
    <div class="row">
      <div class="meter" id="hSw" title="Swings left"><img alt="" data-s="pick"><span class="count" id="hSwings">0</span><div class="bar"><div class="fill" id="hSwFill"></div></div></div>
      <button class="bombbtn" id="btnBomb" aria-pressed="false" aria-label="Bomb: tap it, then tap a block" hidden><img alt="" data-s="i_bomb"><span id="hBombs">0</span></button>
    </div>
  </div>

  <div id="banner" aria-live="polite"><div class="k" id="bnK"></div><div class="n" id="bnN"></div><div class="h" id="bnH"></div></div>

  <div class="overlay" id="title">
    <div class="card">
      <h1 class="logo">Undermine</h1>
      <p class="tag">Tap to dig. Every swing counts. Gems buy a better pick.</p>
      <div id="loading">Sharpening the pickaxe…</div>
      <button class="big" id="btnPlay" hidden>Dig</button>
      <button class="big ghost shopbtn" id="btnShopTitle"><img alt="" data-s="i_gem"><span class="bank">0</span> Shop</button>
      <div class="grid" id="mineGrid" aria-label="Mines"></div>
      <button class="lnk" id="btnSound">Sound: on</button>
      <a class="lnk" href="../">&larr; Inkset experiments</a>
    </div>
  </div>

  <div class="overlay" id="pause" hidden>
    <div class="card">
      <h2 class="sh">Paused</h2>
      <button class="big" id="btnResume">Keep digging</button>
      <div class="row2"><button class="big ghost" id="btnPauseSound">Sound: on</button><button class="big ghost" id="btnQuit">Mines</button></div>
    </div>
  </div>

  <div class="overlay" id="over" hidden>
    <div class="card">
      <p class="mk" id="ovMine">Mine 1</p>
      <h2 class="cause" id="ovCause">Out of swings!</h2>
      <p class="earn" id="ovEarn"></p>
      <div class="stars" id="ovStars"></div>
      <div class="starrows" id="ovRows"></div>
      <button class="big" id="btnNext">Next mine</button>
      <div class="row2"><button class="big ghost" id="btnAgain">Try again</button><button class="big ghost shopbtn" id="btnShopOver"><img alt="" data-s="i_gem"><span class="bank">0</span> Shop</button><button class="big ghost" id="btnMenu">Mines</button></div>
    </div>
  </div>

  <div class="overlay" id="shop" hidden>
    <div class="card">
      <h2 class="sh">Shop</h2>
      <p class="earn"><img alt="" data-s="i_gem"><span id="shopGems">0</span></p>
      <div class="ups" id="shopCards"></div>
      <button class="big" id="btnShopBack">Done</button>
    </div>
  </div>
</div>

<script>
(() => {
"use strict";

// Undermine: tap a block to hit it. Every hit is a swing, and when the swings run out the run is over.
// Gems you dig up stay yours, so a failed run still buys a better pick for the next try.

// ================= constants =================
const COLS = 9;
const E = 0, DIRT = 1, STONE = 2, HARD = 3, BED = 4, GAS = 5, CRYSTAL = 6, TNT = 7, DYN = 8, APPLE = 9, LUNCH = 10, CHAMBER = 11;
const BASE_HP = { [DIRT]: 2, [STONE]: 6, [HARD]: 14, [GAS]: 1, [CRYSTAL]: 2, [TNT]: 1, [DYN]: 1, [APPLE]: 2, [LUNCH]: 2 };
const FOOD = { [APPLE]: 5, [LUNCH]: 12 };                 // swings each one gives back
const GEM_KINDS = ["amber", "emerald", "sapphire", "ruby", "diamond"];
const GEM_VALUE = [1, 2, 4, 8, 15];
const GEMC = { amber: "#ffcf5a", emerald: "#5fe08a", sapphire: "#5aa8ff", ruby: "#ff5a6e", diamond: "#e8fbff" };
const BIOMES = [
  { id: "top", dust: "#9c6b45", chip: "#a39b8f" },
  { id: "clay", dust: "#c8693e", chip: "#b07c69" },
  { id: "stone", dust: "#86817a", chip: "#737b88" },
  { id: "cryst", dust: "#5d4f8e", chip: "#56a8bb" },
  { id: "magma", dust: "#66332b", chip: "#615654" },
  { id: "abyss", dust: "#2a3a52", chip: "#46527a" },
];
const ADJ = ["Crumbly", "Sticky", "Gloomy", "Glittering", "Rumbling", "Twisty", "Hollow", "Dusty", "Lucky", "Sneaky", "Bumpy", "Sleepy", "Deep", "Wobbly", "Shiny", "Muddy"];
const NOUN = ["Burrow", "Pit", "Shaft", "Hollow", "Warren", "Seam", "Den", "Tunnel", "Vein", "Grotto", "Cellar", "Dig"];

// the shop: what each level costs and does
const UPGRADES = [
  { id: "power", name: "Power", icon: "i_power", max: 99, base: 30, grow: 1.32 },
  { id: "swings", name: "Swings", icon: "i_swings", max: 99, base: 25, grow: 1.32 },
  { id: "luck", name: "Luck", icon: "i_clover", max: 8, base: 40, grow: 1.6 },
  { id: "bombs", name: "Bombs", icon: "i_bomb", max: 5, base: 45, grow: 1.9 },
];
// power and swings never max out (prices flatten to +12% a level after 12), so the endless mines always have an answer
for (const up of UPGRADES) up.cost = Array.from({ length: up.max }, (_, i) => Math.round(up.base * Math.pow(up.grow, Math.min(i, 12)) * Math.pow(1.12, Math.max(0, i - 12)) / 5) * 5);
const pickDamage = (lv) => 2 + lv;
const maxSwings = (lv) => 50 + lv * 10;
const luckMul = (lv) => 1 + lv * 0.15;

const COARSE = matchMedia("(pointer: coarse)").matches;
const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
if (COARSE) document.body.classList.add("coarse");

// ================= helpers =================
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const $ = (id) => document.getElementById(id);
function mulberry32(a) { return () => { a |= 0; a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
function hash2(x, y, s) { let h = Math.imul(x | 0, 374761393) + Math.imul(y | 0, 668265263) + Math.imul(s | 0, 1442695041); h = Math.imul(h ^ (h >>> 13), 1274126177); h ^= h >>> 16; return (h >>> 0) / 4294967296; }
function vnoise(x, y, s) {
  const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  const a = hash2(xi, yi, s), b = hash2(xi + 1, yi, s), c = hash2(xi, yi + 1, s), d = hash2(xi + 1, yi + 1, s);
  return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
}

const store = {
  get(k, d) { try { const v = localStorage.getItem("undermine3:" + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem("undermine3:" + k, JSON.stringify(v)); } catch {} },
};
// everything that carries over between runs
const save = {
  gems: store.get("gems", 0),

    stone: 0.22 + 0.16 * t,                          // share of stone and of hard rock, more of both further down

// ================= ending a run =================

// ================= particles =================
function shake(a) { if (!reduceMotion && mode === "play") S.shake = Math.max(S.shake, a); }
function burst(x, y, n, c, sp) { for (let i = 0; i < n; i++) S.parts.push({ x, y, vx: (Math.random() - 0.5) * sp * 2, vy: -Math.random() * sp * 1.4 - 0.5, life: 0.35 + Math.random() * 0.45, max: 0.8, c, s: 0.06 + Math.random() * 0.09, g: 22 }); }

function updateParts(dt) {

    p.life -= dt; if (p.life <= 0) { S.parts.splice(i, 1); continue; }
    p.vy += p.g * dt; if (p.drag) { p.vx *= 1 - p.drag * dt; p.vy *= 1 - p.drag * dt; }

// ================= main update =================
function clampCam(c) { return clamp(c, -3, S.D + 3 - (VIEW_ROWS - TOP / TS)); }
function update(dt) {

  if (P.mv >= 1) P.walk = 0;

    P.ox = P.fx; P.oy = P.fy; P.y++; P.mv = 0; P.fall = (P.fall || 0) + 1;
  } else if (P.mv >= 1 && P.fall) {

// ================= rendering =================

  const u = TS / 32;

  if (dark > 0.01) {
    const g = ctx.createRadialGradient(W / 2, H * 0.5, Math.min(W, H) * 0.3, W / 2, H * 0.5, Math.max(W, H) * 0.75);
    g.addColorStop(0, "rgba(0,0,0,0)"); g.addColorStop(1, `rgba(4,2,6,${dark})`);
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  }
  const gap = P.fy - S.ceil;
  if (S.ceilOn && gap < 4 && !S.won && mode === "play") {
    const a = (1 - gap / 4) * (0.35 + 0.2 * Math.sin(S.time * 10));
    const g = ctx.createLinearGradient(0, 0, 0, H * 0.35);
    g.addColorStop(0, `rgba(190,20,20,${a})`); g.addColorStop(1, "rgba(190,20,20,0)");
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H * 0.35);
  }
  if (S.swings <= 10 && !S.won && mode === "play") {
    const a = (1 - S.swings / 10) * (0.25 + 0.15 * Math.sin(S.time * 8));
    const g = ctx.createRadialGradient(W / 2, H * 0.45, Math.min(W, H) * 0.3, W / 2, H * 0.45, Math.max(W, H) * 0.75);
    g.addColorStop(0, "rgba(120,0,10,0)"); g.addColorStop(1, `rgba(150,10,20,${a})`);
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  }
}
// a slab of dark rock with teeth along the bottom, coming down the shaft
function drawCrusher(X, Y) {
  const c = S.ceil;
  if (Y(c) < -TS) return;
  const by = Y(c), th = TS * 0.3, band = TS * 0.32, top = -TS * 2;
  ctx.fillStyle = "#1c1513"; ctx.fillRect(0, top, W, by - th - band - top);
  ctx.fillStyle = "#2c221e";
  for (let i = 1; i < 8; i++) ctx.fillRect(0, by - th - band - TS * i * 1.4, W, TS * 0.1);
  // hazard band
  ctx.save(); ctx.beginPath(); ctx.rect(0, by - th - band, W, band); ctx.clip();
  ctx.fillStyle = "#ffcf3a"; ctx.fillRect(0, by - th - band, W, band);
  ctx.fillStyle = "#1c1513";
  for (let x = -band; x < W + band; x += band * 1.6) { ctx.beginPath(); ctx.moveTo(x, by - th); ctx.lineTo(x + band * 0.8, by - th); ctx.lineTo(x + band * 1.6, by - th - band); ctx.lineTo(x + band * 0.8, by - th - band); ctx.closePath(); ctx.fill(); }
  ctx.restore();
  // teeth
  const tw = TS * 0.45, n = Math.ceil(W / tw) + 1;
  ctx.fillStyle = "#9a8a80";
  ctx.beginPath(); ctx.moveTo(0, by - th);
  for (let i = 0; i < n; i++) { ctx.lineTo(i * tw + tw / 2, by); ctx.lineTo((i + 1) * tw, by - th); }
  ctx.closePath(); ctx.fill();
  // glows red when it's close to the mole
  const gap = S.P.fy - c;
  if (gap < 4 && !S.won) {
    const a = (1 - gap / 4) * (0.55 + 0.35 * Math.sin(S.time * 12));
    const g = ctx.createLinearGradient(0, by - th, 0, by + TS * 1.2);
    g.addColorStop(0, `rgba(255,60,40,${a})`); g.addColorStop(1, "rgba(255,60,40,0)");
    ctx.fillStyle = g; ctx.fillRect(0, by - th, W, TS * 1.2 + th);
  }
  // dust shaken loose
  if (Math.random() < 0.35 && mode !== "over") S.parts.push({ x: Math.random() * COLS, y: c, vx: 0, vy: 1, life: 0.6, max: 0.6, c: "#6a5a50", s: 0.05, g: 10 });
}
function drawTile(t, v, cx, cy, u, bi) {
  if (t === STONE) { spr(`dirt_${bi}_${v}`, cx, cy, u * 1.002); spr(`rock_${bi}`, cx, cy, u * 1.002); return; }
  if (t === HARD) { spr(`hard_${bi}`, cx, cy, u * 1.002); return; }
  if (t === BED) { spr("bedrock", cx, cy, u * 1.002); return; }
  if (t === GAS) { spr("gas", cx, cy, u * 1.002); return; }
  if (t === CRYSTAL) { spr("crystal", cx, cy, u * 1.002); return; }
  if (t === TNT) { spr("tnt", cx, cy, u * 1.002); return; }
  if (t === DYN) { spr("dynamite", cx, cy, u * 1.002); return; }
  spr(`dirt_${bi}_${v}`, cx, cy, u * 1.002);
  if (t === APPLE) spr("apple", cx, cy, u * 0.95);
  else if (t === LUNCH) spr("lunch", cx, cy, u * 0.95);
}
function drawCracks(x, y, hp, seed) {
  ctx.strokeStyle = "rgba(10,6,4,.75)"; ctx.lineWidth = Math.max(1.4, TS * 0.05); ctx.lineCap = "round";
  const n = 1 + Math.floor(hp * 5);
  ctx.beginPath();
  for (let i = 0; i < n; i++) {
    const a = hash2(seed, i, 1) * Math.PI * 2, len = TS * (0.2 + 0.3 * hp);
    const mx = x + TS / 2 + Math.cos(a + 0.5) * len * 0.5, my = y + TS / 2 + Math.sin(a + 0.5) * len * 0.5;
    ctx.moveTo(x + TS / 2, y + TS / 2); ctx.lineTo(mx, my); ctx.lineTo(x + TS / 2 + Math.cos(a) * len, y + TS / 2 + Math.sin(a) * len);
  }
  ctx.stroke();
}
function drawMole(X, Y, u) {
  const P = S.P;
  const cx = X(P.fx) + TS / 2, cy = Y(P.fy) + TS / 2;
  let oy = 0;
  if (P.mv < 1) oy -= Math.sin(P.mv * Math.PI) * TS * 0.25;
  if (S.won) oy -= Math.abs(Math.sin(S.time * 10)) * TS * 0.25 * Math.min(1, S.endT * 3);
  const name = S.over ? "mole_hurt" : P.blink < 0 ? "mole_blink" : "mole";
  const face = P.face < 0;
  ctx.save(); ctx.translate(cx, cy + oy + TS * 0.04);
  spr(name, 0, 0, u * 0.9, face ? { flip: true } : undefined);
  ctx.restore();
  // the pick swings toward the block being hit
  const sw = P.swing;
  let a;
  if (S.won) a = (face ? 1 : -1) * 1.2;
  else if (P.sdy > 0 && !P.sdx) a = (face ? 1 : -1) * (0.3 + sw * 1.1) + (face ? -0.3 : 0.3);
  else if (P.sdy < 0 && !P.sdx) a = (face ? 1 : -1) * (-1.4 + sw * 0.6);
  else a = (face ? -1 : 1) * (-0.6 + sw * 1.3);
  ctx.save(); ctx.translate(cx + (face ? -1 : 1) * TS * 0.22, cy + TS * 0.08 + oy); ctx.rotate(a); spr("pick", TS * (face ? -0.12 : 0.12), -TS * 0.2, u * 0.78, face ? { flip: true } : undefined); ctx.restore();
}

// ================= HUD =================
const hud = { sw: -1, gems: -1, prog: -1, mine: -1 };
function updateHUD() {
  if (hud.mine !== S.mine) { hud.mine = S.mine; $("hMine").textContent = S.mine; $("hMine").style.fontSize = S.mine > 99 ? "11px" : S.mine > 9 ? "13px" : ""; }
  const d = S.deepest;
  if (hud.prog !== d) { hud.prog = d; $("hDepth").innerHTML = Math.max(0, S.D - d) + "<small>m</small>"; $("hProg").style.width = clamp(d / S.D, 0, 1) * 100 + "%"; }
  if (hud.gems !== S.runGems) { hud.gems = S.runGems; $("hGems").textContent = S.runGems; }
  if (hud.sw !== S.swings) {
    hud.sw = S.swings;
    $("hSwings").textContent = S.swings;
    $("hSw").classList.toggle("low", S.swings <= 10);
    $("hSwFill").style.transform = `scaleX(${clamp(S.swings / S.maxSw, 0.02, 1)})`;
  }
}
function updateBombBtn() {
  const b = $("btnBomb");
  b.hidden = S.bombs <= 0 && !S.armed;
  $("hBombs").textContent = S.bombs;
  b.classList.toggle("armed", S.armed);
  b.setAttribute("aria-pressed", S.armed ? "true" : "false");
}
function toggleBomb() {
  if (mode !== "play" || S.won || S.over) return;
  if (!S.armed && S.bombs <= 0) return;
  S.armed = !S.armed; updateBombBtn(); uiSfx("click", 0.6, S.armed ? 1.2 : 0.9);
}
function banner(k, n, h) {
  if (mode === "title") return;
  const b = $("banner");
  $("bnK").textContent = k || ""; $("bnN").textContent = n || ""; $("bnH").textContent = h || "";
  b.classList.remove("show"); void b.offsetWidth; b.classList.add("show");
}

// ================= shop =================
function renderShop() {
  $("shopGems").textContent = save.gems;
  $("shopCards").innerHTML = UPGRADES.map((up) => {
    const lv = save.lv[up.id], maxed = lv >= up.max, price = maxed ? 0 : up.cost[lv];
    const can = !maxed && save.gems >= price;
    const now = up.id === "power" ? pickDamage(lv) + " per hit" : up.id === "swings" ? maxSwings(lv) + " swings" : up.id === "luck" ? "×" + luckMul(lv).toFixed(2).replace(/0$/, "") + " gems" : lv + " per run";
    return `<button class="up${can ? " can" : ""}" data-id="${up.id}" ${maxed ? "disabled" : ""} aria-label="${up.name}, level ${lv} of ${up.max}${maxed ? ", maxed" : ", costs " + price + " gems"}">
      <img alt="" src="${iconURL(up.icon)}"><b>${up.name}</b><span class="now">${now}</span>
      <span class="lv">Level ${lv}${up.max < 99 ? `<small> / ${up.max}</small>` : ""}</span>
      <span class="price">${maxed ? "Max" : `<img alt="" src="${iconURL("i_gem")}">${price}`}</span></button>`;
  }).join("");
  for (const b of $("shopCards").querySelectorAll(".up")) b.addEventListener("click", () => buy(b.dataset.id));
}
function buy(id) {
  const up = UPGRADES.find((u) => u.id === id), lv = save.lv[id];
  if (lv >= up.max || save.gems < up.cost[lv]) { uiSfx("click", 0.5, 0.7); return; }
  initAudio();
  save.gems -= up.cost[lv]; save.lv[id]++; save.flush();
  uiSfx("craft", 0.8, 1 + save.lv[id] * 0.04);
  renderShop(); renderGrid(); refreshGemLabels();
  const b = $("shopCards").querySelector(`[data-id="${id}"]`); if (b) { b.classList.add("bought"); b.focus({ preventScroll: true }); }
}
let shopFrom = "title";
function openShop(from) { shopFrom = from; renderShop(); $("shop").hidden = false; $(from).hidden = true; uiSfx("click", 0.5); const f = $("shopCards").querySelector(".up.can") || $("btnShopBack"); f.focus({ preventScroll: true }); }
function closeShop() { $("shop").hidden = true; $(shopFrom).hidden = false; refreshGemLabels(); if (shopFrom === "over") renderOverButtons(); }
function refreshGemLabels() { for (const el of document.querySelectorAll(".bank")) el.textContent = save.gems; const can = UPGRADES.some((u) => save.lv[u.id] < u.max && save.gems >= u.cost[save.lv[u.id]]); for (const el of document.querySelectorAll(".shopbtn")) el.classList.toggle("can", can); }

// ================= progress =================
function unlocked() { let n = 1; while (save.stars[n]) n++; return n; }
function nextMine() { return unlocked(); }
function renderGrid() {
  const s = save.stars, u = unlocked();
  const first = Math.max(1, u - 7);
  let h = "";
  for (let n = first; n < first + 10; n++) {
    const st = s[n] || 0, open = n <= u;
    h += `<button class="mb${n === u ? " next" : ""}" data-n="${n}" ${open ? "" : "disabled"} aria-label="Mine ${n}${st ? ", " + st + " stars" : ""}"><b>${n}</b><span class="st">${[1, 2, 3].map((i) => `<img alt="" src="${iconURL(i <= st ? "i_star" : "i_star_off")}">`).join("")}</span></button>`;
  }
  $("mineGrid").innerHTML = h;
  for (const b of $("mineGrid").querySelectorAll(".mb")) b.addEventListener("click", () => startMine(+b.dataset.n));
  $("btnPlay").textContent = u > 1 ? "Dig: mine " + u : "Dig";
}

// ================= flow =================
function startMine(n) {
  initAudio();
  newMine(n);
  for (const k in hud) hud[k] = -1;
  mode = "play";
  for (const id of ["title", "over", "pause", "shop"]) $(id).hidden = true;
  $("hud").hidden = false;
  resize();
  S.cam = S.camT = -3;
  updateBombBtn();
  last = performance.now();
  banner("Mine " + n, S.spec.name, n === 1 && !save.stars[1] ? "Tap a block to hit it. Stay ahead of the crusher!" : "");
}
function pause() {
  if (mode !== "play") return;
  mode = "pause";
  $("pause").hidden = false;
  if (actx) actx.suspend();
}
function resume() {
  if (mode !== "pause") return;
  $("pause").hidden = true; mode = "play"; last = performance.now();
  if (actx) actx.resume();
}
function showResult() {
  if (mode !== "play") return;
  mode = "over";
  save.flush();
  const won = S.won;
  const rows = [
    { txt: "Reached the treasure", ok: won },
    { txt: `${S.gemGoal}+ gems dug (got ${S.gemCount})`, ok: won && S.gemCount >= S.gemGoal },
    { txt: `A quarter of your swings left`, ok: won && S.swings >= S.maxSw * 0.25 },
  ];
  const stars = rows.filter((r) => r.ok).length;
  if (won) { save.stars[S.mine] = Math.max(save.stars[S.mine] || 0, stars); save.flush(); }
  $("ovMine").textContent = "Mine " + S.mine;
  $("ovCause").textContent = won ? "Treasure!" : S.cause === "crush" ? "Crushed!" : "Out of swings!";
  $("ovCause").classList.toggle("win", won);
  $("ovEarn").innerHTML = `<img alt="" src="${iconURL("i_gem")}">+${S.runGems}<small>${won ? "" : " · " + Math.round(100 * S.deepest / S.D) + "% of the way down"}</small>`;
  $("ovStars").hidden = !won; $("ovRows").hidden = !won;
  $("ovStars").innerHTML = [0, 1, 2].map((i) => `<img alt="" src="${iconURL(i < stars ? "i_star" : "i_star_off")}">`).join("");
  $("ovRows").innerHTML = rows.map((r) => `<div class="${r.ok ? "on" : ""}"><img alt="" src="${iconURL(r.ok ? "i_star" : "i_star_off")}"><span>${r.txt}</span></div>`).join("");
  renderOverButtons();
  $("over").hidden = false; $("hud").hidden = true;
  if (won) $("ovStars").querySelectorAll("img").forEach((im, i) => setTimeout(() => { im.classList.add("pop"); if (i < stars) uiSfx("star", 0.8, 1 + i * 0.12); }, 250 + i * 280));
  else uiSfx("gameover", 0.6);
}
function renderOverButtons() {
  const won = S.won;
  refreshGemLabels();
  $("btnNext").hidden = !won;
  $("btnAgain").className = won ? "big ghost" : "big";
  (won ? $("btnNext") : $("btnAgain")).focus({ preventScroll: true });
}
function toTitle() {
  mode = "title";
  for (const id of ["over", "pause", "shop"]) $(id).hidden = true;
  $("hud").hidden = true;
  $("title").hidden = false;
  renderGrid(); refreshGemLabels();
  newMine(1, true); S.demoT = 0;
  resize();
}

$("btnPlay").addEventListener("click", () => startMine(nextMine()));
$("btnNext").addEventListener("click", () => startMine(S.mine + 1));
$("btnAgain").addEventListener("click", () => startMine(S.mine));
$("btnMenu").addEventListener("click", toTitle);
$("btnPause").addEventListener("click", pause);
$("btnResume").addEventListener("click", resume);
$("btnQuit").addEventListener("click", () => { $("pause").hidden = true; if (actx) actx.resume(); toTitle(); });
$("btnSound").addEventListener("click", () => { setMuted(!muted); if (!muted) initAudio(); });
$("btnPauseSound").addEventListener("click", () => setMuted(!muted));
$("btnBomb").addEventListener("click", toggleBomb);
$("btnShopTitle").addEventListener("click", () => openShop("title"));
$("btnShopOver").addEventListener("click", () => openShop("over"));
$("btnShopBack").addEventListener("click", closeShop);

// ================= loop =================
let last = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (mode === "play" || mode === "over") update(dt);
  else if (mode === "title" && S) attract(dt);
  if (S) { draw(); if (mode === "play") updateHUD(); }
}
// the title screen: the mole digs mine 1 on its own behind the menu
function attract(dt) {
  S.demoT -= dt;
  S.swings = 999;
  if (S.demoT <= 0 && !S.job) { S.demoT = 0.3; const c = botChoice(); if (c) tapCell(c.x, c.y); }
  update(dt);
  if (S.won && S.endT > 1.5 || S.over && S.endT > 1.2 || S.P.y > 30) { newMine(1, true); S.demoT = 0; }
}
// a greedy chooser, used by the title demo and the balance check: value per swing, with depth counting as value
function botChoice(opt = {}) {
  let best = null, bs = -1e9;
  const deep = S.deepest;
  for (let y = Math.max(0, deep - 14); y < Math.min(S.D, deep + 2); y++) for (let x = 0; x < COLS; x++) {
    if (!exposed(x, y)) continue;
    const k = K(x, y), t = S.t[k];
    const hits = Math.max(1, Math.ceil(S.hp[k] / S.dmg));
    let v = (y >= deep ? 2.2 : 0.2) + (y + 1 - deep > 0 ? 0.6 : 0);
    if (S.P.fy - S.ceil < 4 && y <= S.P.y) v = v * 0.1 - 2;   // the crusher is close: only down will do
    if (S.g[k]) v += GEM_VALUE[S.g[k] - 1] * (opt.greed ?? 0.6);
    if (FOOD[t]) v += FOOD[t] * (S.swings < 40 ? 1.2 : 0.6);
    if (t === TNT || t === GAS) v += 4; if (t === DYN) v += 7; if (t === CRYSTAL) v += 3;
    const s = v / hits - (hits > 3 ? 0.3 : 0) + y * 0.01;
    if (s > bs) { bs = s; best = { x, y }; }
  }
  return best;
}

// ================= boot =================
setMuted(muted);
resize();
loadSprites().then(() => {
  fillIcons();
  toTitle();
  $("loading").hidden = true; $("btnPlay").hidden = false;
  if (!COARSE) $("btnPlay").focus();
  requestAnimationFrame(frame);
});
// test hooks (used by sim.js)
window.__um = {
  get S() { return S; }, get mode() { return mode; }, save, UPGRADES, startMine, tapCell, botChoice, exposed, get,
  step(dt) { if (mode === "play") update(dt); }, buy, reset() { save.gems = 0; save.lv = { power: 0, swings: 0, luck: 0, bombs: 0 }; save.stars = {}; save.flush(); },
};
})();
</script>
</body>
</html>
