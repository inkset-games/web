<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1b1430">
<meta name="description" content="A physics cannon game at a dusk fairground. Point at a stack, fire, and knock every can and bottle down across ten stalls.">
<meta property="og:title" content="Topple Fair — an Inkset experiment">
<meta property="og:description" content="Ten fairground stalls, a cannon and a bag of balls. Point at a stack and let it fly.">
<meta property="og:image" content="https://inkset.games/experiments/topple/og.png">
<meta property="og:url" content="https://inkset.games/experiments/topple/">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" type="image/png" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<title>Topple Fair</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bowlby+One&family=Nunito:wght@700;800;900&display=swap">
<style>
/* Layout: full-bleed canvas stage framed per stall; slim glass HUD on top; marquee "booth" cards for menus. One dusk look in every theme. */
:root {
  --night: #1b1430;
  --dusk: #2b1f4f;
  --plum: #4a2f6b;
  --cream: #fff4e2;
  --gold: #f2a531;
  --gold-hi: #ffd66b;
  --coral: #d8435a;
  --coral-deep: #7a1f3d;
  --muted: rgba(255, 244, 226, 0.66);
  --glass: rgba(27, 20, 48, 0.62);
  --glass-line: rgba(255, 244, 226, 0.14);
  --display: "Bowlby One", "Arial Black", Impact, sans-serif;
  --body: "Nunito", ui-rounded, "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  background: var(--night); color: var(--cream);
  font-family: var(--body); font-weight: 800;
  overflow: hidden; overscroll-behavior: none;
  -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
}
#app { position: relative; width: 100%; height: 100%; overflow: hidden; }
#cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: none; }
#cv.menu { cursor: default; }

/* ---------- HUD ---------- */
#hud {
  position: absolute; top: 0; left: 0; right: 0;
  display: flex; align-items: center; gap: 8px;
  padding-top: 12px;
  padding-left: max(14px, env(safe-area-inset-left, 0px));
  padding-right: max(14px, env(safe-area-inset-right, 0px));
  pointer-events: none;
}
#hud > * { pointer-events: auto; }
.pill {
  height: 40px; display: flex; align-items: center; gap: 8px;
  background: var(--glass); border: 1px solid var(--glass-line);
  border-radius: 999px; padding: 0 14px;
  backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
}
.round {
  width: 40px; height: 40px; flex: none; padding: 0;
  display: grid; place-items: center;
  background: var(--glass); color: var(--cream);
  border: 1px solid var(--glass-line); border-radius: 50%;
  backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  cursor: pointer; transition: background .15s, transform .1s;
}
.round:hover { background: rgba(74, 47, 107, .8); }
.round:active { transform: scale(.92); }
.round svg { width: 18px; height: 18px; }
.stage-name { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; line-height: 1.05; padding-left: 4px; text-shadow: 0 2px 6px rgba(0,0,0,.35); }
.stage-name .k { font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: var(--gold-hi); }
.stage-name .n { font-family: var(--display); font-size: 18px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.score { font-family: var(--display); font-size: 17px; font-variant-numeric: tabular-nums; min-width: 3.2ch; text-align: right; }
.score.bump { animation: bump .25s ease-out; }
@keyframes bump { 40% { transform: scale(1.25); color: var(--gold-hi); } }
.ammo { gap: 4px; padding: 0 10px; }
.ammo i { width: 14px; height: 14px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #c9c6e6, #3f3d5c 70%); box-shadow: inset 0 0 0 1.5px #1d1530; transition: transform .25s, opacity .25s; }
.ammo i.used { opacity: .18; transform: scale(.7); }
button:focus-visible { outline: 3px solid var(--gold-hi); outline-offset: 2px; }
@media (max-width: 430px) {
  .stage-name .n { font-size: 15px; }
  .score { font-size: 15px; }
  .pill { padding: 0 10px; }
  .ammo { display: none !important; }
  .stage-name .of { display: none; }
  #hud { gap: 6px; }
}

/* ---------- banner ---------- */
#banner {
  position: absolute; left: 50%; top: 30%;
  transform: translate(-50%, -50%);
  text-align: center; pointer-events: none;
  opacity: 0; padding: 16px 28px 18px; border-radius: 20px;
  background: radial-gradient(ellipse at center, rgba(27,20,48,.72), rgba(27,20,48,.45) 70%, rgba(27,20,48,0));
  max-width: calc(100% - 32px);
}
#banner.show { animation: banner 2.1s cubic-bezier(.2,.8,.2,1) forwards; }
@keyframes banner {
  0% { opacity: 0; transform: translate(-50%, -30%) scale(.9); }
  14% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  78% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  100% { opacity: 0; transform: translate(-50%, -64%) scale(1); }
}
#banner .k { font-size: 13px; letter-spacing: .3em; text-transform: uppercase; color: var(--gold-hi); }
#banner .n { font-family: var(--display); font-size: clamp(34px, 9vw, 58px); line-height: 1; color: var(--cream); text-shadow: 0 4px 0 var(--coral), 0 10px 24px rgba(0,0,0,.4); white-space: nowrap; }
#banner .h { margin-top: 10px; font-size: 14px; color: var(--muted); text-shadow: 0 1px 4px rgba(0,0,0,.5); }

/* ---------- overlays ---------- */
.overlay {
  position: absolute; inset: 0;
  display: grid; place-items: center;
  padding-block: 24px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: radial-gradient(ellipse at 50% 40%, rgba(27,20,48,.35), rgba(27,20,48,.78));
  overflow-y: auto;
}
.overlay.enter .booth { animation: rise .45s cubic-bezier(.2,1.3,.4,1) both; }
@keyframes rise { from { opacity: 0; transform: translateY(24px) scale(.96); } }
.booth {
  width: min(400px, 100%);
  background: linear-gradient(180deg, rgba(58,36,92,.94), rgba(31,22,56,.96));
  border: 1px solid rgba(255, 214, 107, .35);
  border-radius: 22px;
  padding: 30px 22px 22px;
  text-align: center; display: grid; gap: 18px;
  box-shadow: 0 30px 70px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.08);
  position: relative;
}
.booth::before {
  content: ""; position: absolute; left: 22px; right: 22px; top: 12px; height: 8px;
  background: radial-gradient(circle, var(--gold-hi) 0 2.5px, transparent 3.5px) 0 0 / 18px 8px repeat-x;
  filter: drop-shadow(0 0 4px var(--gold)); opacity: .9;
  animation: chase 1.2s steps(2) infinite;
}
@keyframes chase { 50% { opacity: .45; } }
.logo { font-family: var(--display); font-size: clamp(54px, 17vw, 76px); line-height: .82; color: var(--gold-hi); text-shadow: 0 5px 0 var(--coral), 0 14px 28px rgba(0,0,0,.35); margin-top: 6px; }
.logo span { display: block; color: var(--cream); font-size: .42em; letter-spacing: .32em; margin: .5em 0 0 .32em; text-shadow: none; }
.sub { color: var(--muted); font-size: 15px; line-height: 1.4; text-wrap: balance; margin: 0; }
.big-btn {
  font-family: var(--display); font-size: 21px; letter-spacing: .02em;
  color: #3a1d08; background: linear-gradient(#ffe08a, var(--gold));
  border: 0; border-radius: 16px; padding: 14px 18px; cursor: pointer;
  box-shadow: 0 5px 0 #9a5a12, 0 10px 20px rgba(0,0,0,.25), inset 0 1px 0 rgba(255,255,255,.6);
  transition: transform .08s, box-shadow .08s, filter .15s;
}
.big-btn:hover { filter: brightness(1.06); }
.big-btn:active { transform: translateY(4px); box-shadow: 0 1px 0 #9a5a12, 0 4px 10px rgba(0,0,0,.25); }
.big-btn.ghost { background: rgba(255,244,226,.08); color: var(--cream); box-shadow: inset 0 0 0 1.5px rgba(255,244,226,.25); }
.big-btn.ghost:active { transform: translateY(2px); }
.row { display: flex; gap: 10px; flex-wrap: wrap; }
.row > * { flex: 1 1 130px; }
.label { font-size: 11px; letter-spacing: .2em; text-transform: uppercase; color: var(--gold-hi); margin: 0; opacity: .85; }
.grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
.lv {
  aspect-ratio: 1; max-width: 100%; padding: 0;
  display: grid; place-items: center; align-content: center; gap: 3px;
  background: rgba(255,244,226,.06); color: var(--cream);
  border: 1px solid rgba(255,244,226,.12); border-radius: 12px;
  font-family: var(--display); font-size: 18px; cursor: pointer;
  transition: background .15s, border-color .15s, transform .1s;
}
.lv:hover:not(:disabled) { background: rgba(255,214,107,.14); border-color: rgba(255,214,107,.5); }
.lv:active:not(:disabled) { transform: scale(.94); }
.lv.cur { border-color: var(--gold); box-shadow: 0 0 0 2px rgba(242,165,49,.25); }
.lv:disabled { opacity: .3; cursor: not-allowed; }
.lv .st { display: flex; gap: 1px; }
.lv .st b { width: 8px; height: 8px; clip-path: polygon(50% 0, 63% 35%, 100% 38%, 71% 61%, 80% 100%, 50% 78%, 20% 100%, 29% 61%, 0 38%, 37% 35%); background: rgba(255,244,226,.22); }
.lv .st b.on { background: var(--gold-hi); }
.how { display: flex; justify-content: center; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
.how span { display: flex; align-items: center; gap: 6px; }
.how svg { width: 16px; height: 16px; color: var(--gold-hi); }
.how span.ht { display: none; }
.sound-toggle { justify-self: center; display: inline-flex; align-items: center; gap: 8px; font: inherit; font-size: 13px; color: var(--muted); background: none; border: 1px solid rgba(255,244,226,.18); border-radius: 999px; padding: 7px 14px; cursor: pointer; }
.sound-toggle::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--gold-hi); box-shadow: 0 0 6px var(--gold); }
.sound-toggle[aria-pressed="false"]::before { background: rgba(255,244,226,.25); box-shadow: none; }
.sound-toggle:hover { color: var(--cream); border-color: rgba(255,214,107,.5); }
@media (pointer: coarse) { .how span.ht { display: inline; } .how span.hm { display: none; } }

.stars { display: flex; justify-content: center; align-items: flex-end; gap: 4px; height: 76px; }
.stars img { width: 62px; height: 62px; transform: scale(0) rotate(-30deg); }
.stars img:nth-child(2) { width: 74px; height: 74px; margin-bottom: 8px; }
.stars img.in { animation: pop .5s cubic-bezier(.3,1.7,.5,1) forwards; }
@keyframes pop { to { transform: scale(1) rotate(0); } }
.result-title { font-family: var(--display); font-size: 36px; color: var(--gold-hi); margin: 0; line-height: 1; text-shadow: 0 4px 0 var(--coral); }
.result-title.lose { color: var(--cream); text-shadow: 0 4px 0 var(--plum); }
.tally { display: grid; gap: 6px; font-size: 14px; color: var(--muted); }
.tally div { display: flex; justify-content: space-between; gap: 12px; padding: 0 6px; font-variant-numeric: tabular-nums; }
.tally .total { color: var(--cream); font-family: var(--display); font-size: 26px; padding-top: 6px; border-top: 1px solid rgba(255,244,226,.12); }
#loading { font-family: var(--display); color: var(--gold-hi); font-size: 18px; }
@media (prefers-reduced-motion: reduce) {
  .stars img.in, .overlay.enter .booth, .booth::before { animation: none; transform: none; }
  #banner.show { animation-duration: .01s; }
}
</style>
</head>
<body>


<div id="app">
  <canvas id="cv" class="menu" aria-label="Topple Fair playfield"></canvas>

  <div id="hud" hidden>
    <button class="round" id="btnMenu" aria-label="All stalls">
      <svg viewBox="0 0 20 20" fill="currentColor"><rect x="3" y="3" width="6" height="6" rx="1.6"/><rect x="11" y="3" width="6" height="6" rx="1.6"/><rect x="3" y="11" width="6" height="6" rx="1.6"/><rect x="11" y="11" width="6" height="6" rx="1.6"/></svg>
    </button>
    <div class="stage-name"><span class="k" id="hudNum">Stall 1</span><span class="n" id="hudName">Warm-up</span></div>
    <div class="pill"><span class="score" id="hudScore">0</span></div>
    <div class="pill ammo" id="hudBalls" aria-label="Balls left"></div>
    <button class="round" id="btnRestart" aria-label="Restart stall">
      <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M16 10.5a6 6 0 1 1-2.2-5"/><path d="M15 2.5v4h-4"/></svg>
    </button>
    <button class="round" id="btnMute" aria-label="Mute sound">
      <svg viewBox="0 0 20 20" id="icoSound"></svg>
    </button>
  </div>

  <div id="banner" aria-live="polite"><div class="k" id="bnK"></div><div class="n" id="bnN"></div><div class="h" id="bnH"></div></div>

  <div class="overlay enter" id="title">
    <div class="booth">
      <div class="logo">Topple<span>Fair</span></div>
      <p class="sub">Ten stalls, a cannon and a bag of balls. Point at a stack and let it fly.</p>
      <div id="loading">Raising the tents…</div>
      <button class="big-btn" id="btnPlay" hidden>Play</button>
      <div class="how">
        <span><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2"><circle cx="10" cy="10" r="6"/><circle cx="10" cy="10" r="1.5" fill="currentColor"/></svg><span class="hm">Point to aim</span><span class="ht">Drag anywhere to aim</span></span>
        <span><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M7 11V5a1.5 1.5 0 0 1 3 0v5m0-1.5a1.5 1.5 0 0 1 3 0V11m0-1a1.5 1.5 0 0 1 3 0v3a5 5 0 0 1-5 5h-1a5 5 0 0 1-4-2l-2-3a1.5 1.5 0 0 1 2.3-1.9L7 12"/></svg><span class="hm">Click to fire</span><span class="ht">Lift to fire, or tap a target</span></span>
      </div>
      <p class="label">Stalls</p>
      <div class="grid" id="levelGrid"></div>
      <button class="sound-toggle" id="btnTitleMute" aria-pressed="true">Sound on</button>
      <a href="../" style="justify-self:center;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);text-decoration:none">&larr; Inkset experiments</a>
    </div>
  </div>

  <div class="overlay" id="result" hidden>
    <div class="booth">
      <p class="result-title" id="resTitle">Cleared!</p>
      <div class="stars" id="resStars"></div>
      <div class="tally" id="resTally"></div>
      <div class="row">
        <button class="big-btn ghost" id="btnRetry">Replay</button>
        <button class="big-btn" id="btnNext">Next stall</button>
      </div>
      <button class="big-btn ghost" id="btnResMenu" style="font-size:15px;padding:10px">All stalls</button>
    </div>
  </div>
</div>

const SHIFT = -40;   // pulls every stall a little closer to the cannon
function builder() {
  const items = [], stands = [];
  const b = {
    stand(cx, top, w) { const s = { cx: cx + SHIFT, top, w }; stands.push(s); return s; },
    put(kind, cx, bottom) { const h = DIMS[kind][1]; items.push({ kind, x: cx + SHIFT, y: bottom - h / 2 }); return bottom - h; },
    row(kind, cx, bottom, n, gap) {
      const w = DIMS[kind][0], tot = n * w + (n - 1) * gap;
      for (let i = 0; i < n; i++) b.put(kind, cx - tot / 2 + w / 2 + i * (w + gap), bottom);
      return bottom - DIMS[kind][1];
    },
    pyramid(kind, cx, bottom, rows, _s, gap = 3) { let y = bottom; for (let r = rows; r >= 1; r--) y = b.row(kind, cx, y, r, gap); return y; },
  };
  return { b, items, stands };
}

const sprites = {};
function loadSprites() {
  return Promise.all(Object.entries(ASSETS.sprites).map(([name, svg]) => new Promise((res) => {
    const m = svg.match(/width="([\d.]+)" height="([\d.]+)"/);
    const img = new Image();
    img.onload = () => { sprites[name] = { img, w: +m[1], h: +m[2], cache: new Map() }; res(); };
    img.onerror = () => res();
    img.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg);
  })));
}
// rasterize at a quantized pixel scale so camera moves don't re-render every frame
function raster(name, ps) {

  $("btnMute").setAttribute("aria-label", muted ? "Unmute sound" : "Mute sound");
  $("btnTitleMute").setAttribute("aria-pressed", String(!muted));
  $("btnTitleMute").textContent = muted ? "Sound off" : "Sound on";
  $("icoSound").innerHTML = '<path d="M3 7.5h3l4-3.5v12l-4-3.5H3z" fill="currentColor"/>' + (muted
    ? '<path d="M13.5 7.5l4.5 5M18 7.5l-4.5 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>'
    : '<path d="M13 7a4.2 4.2 0 0 1 0 6M15.5 4.8a7.5 7.5 0 0 1 0 10.4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>');
}
function toggleMute() { muted = !muted; store.set("muted", muted); setMuteIcon(); initAudio(); if (master) master.gain.value = muted ? 0 : 1; }
$("btnMute").onclick = toggleMute;
$("btnTitleMute").onclick = toggleMute;
setMuteIcon();

// ================= update =================
function isKnocked(t) {
  if (t.gone) return true;
  const d = Math.hypot(t.position.x - t.home.x, t.position.y - t.home.y);
  let a = Math.abs(t.angle) % Math.PI; if (a > Math.PI / 2) a = Math.PI - a;
  return d > t.h * 0.6 || a > 0.6 || t.position.y > GROUND + 200;
}
function step(now) {
  const ts = engine.timing.timeScale;
  Engine.update(engine, 1000 / 120);
  Engine.update(engine, 1000 / 120);
  for (let i = pending.length - 1; i >= 0; i--) { const p = pending[i]; p.t -= 16.7 * ts; if (p.t <= 0) { pending.splice(i, 1); p.fn(); } }

  for (const b of Composite.allBodies(engine.world)) {
    if (b.isStatic) continue;
    if (b.position.y > GROUND + 400 || b.position.x < -500 || b.position.x > 1800) removeBody(b);
  }
  for (const b of balls) if (!b.gone) { b.trail.push({ x: b.position.x, y: b.position.y }); if (b.trail.length > 14) b.trail.shift(); }

  // knockdowns
  let changed = false;
  for (const t of targets) {
    if (t.down || !isKnocked(t)) continue;
    t.down = true; changed = true; knocked++;
    combo = now - comboT < 900 ? combo + 1 : 1; comboT = now;
    const pts = POINTS * Math.min(combo, 5); score += pts;
    const p = t.gone ? t.position : t.position;
    play("pop", 0.6, 1 + Math.min(combo - 1, 6) * 0.08, panOf(p.x));
    let py = p.y - 30;
    for (const q of popups) if (q.life < 30 && Math.abs(q.x - p.x) < 70 && Math.abs(q.y - py) < 30) py = q.y - 32;
    popups.push({ x: p.x, y: py, text: "+" + pts, sub: combo > 1 ? "x" + Math.min(combo, 5) : "", life: 0, max: 60 });
    for (let i = 0; i < 8; i++) particles.push({ type: "spark", x: p.x, y: p.y, vx: rnd(-3, 3), vy: rnd(-5, -1), life: 0, max: rnd(18, 30), r: rnd(2, 3.5) });
  }
  if (changed) { renderHud(); bumpScore(); }

  if (state === "play") {
    const left = targets.length - knocked;
    if (left === 0) { state = "won"; stateT = now; slowT = reduceMotion ? 0 : 1; }
    else if (ballsLeft === 0 && lastShot) {
      const since = now - lastShot;
      const moving = Composite.allBodies(engine.world).some((b) => !b.isStatic && !b.isSleeping && Body.getSpeed(b) > 0.3);
      if ((since > 2000 && !moving) || since > 9000) { state = "lost"; stateT = now; }
    }
  } else if (state === "won" && now - stateT > 1300) { state = "result"; showResult(true); }
  else if (state === "lost" && now - stateT > 300) { state = "result"; showResult(false); }

  // slow-motion finish
  if (slowT > 0) { slowT = Math.max(0, slowT - 0.022); engine.timing.timeScale = 1 - 0.7 * Math.sin(Math.min(1, slowT) * Math.PI / 2); }
  else engine.timing.timeScale = 1;

  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i]; p.life++;
    if (p.vx != null) { p.x += p.vx; p.y += p.vy; }
    if (p.type === "smoke" || p.type === "dust") { p.vx *= 0.94; p.vy = p.vy * 0.94 - 0.03; p.r += 0.3; }
    else if (p.type === "fire") { p.vx *= 0.9; p.vy *= 0.9; }
    else if (p.type === "confetti") { p.vx += Math.sin((p.life + i) * 0.1) * 0.05; p.rot += p.vr; }
    else if (p.type === "shard" || p.type === "spark") { p.vy += 0.3; if (p.rot != null) p.rot += p.vr; if (p.y > GROUND + 4) { p.y = GROUND + 4; p.vy *= -0.3; p.vx *= 0.7; } }
    if (p.life > p.max) particles.splice(i, 1);
  }
  for (let i = popups.length - 1; i >= 0; i--) { const p = popups[i]; p.life++; p.y -= 0.9; if (p.life > p.max) popups.splice(i, 1); }
  barrelAngle += (aim.angle - barrelAngle) * 0.3;
  recoil *= 0.8; shake *= 0.86; flashT = Math.max(0, flashT - 0.12);
}

// ================= draw =================
function spr(name, x, y, w, h, ps) { const r = raster(name, ps); if (r) ctx.drawImage(r.cnv, x, y, w ?? r.w, h ?? r.h); return r; }
function drawSprite(name, x, y, angle, ps, sc = 1) {
  const r = raster(name, ps); if (!r) return;
  ctx.save(); ctx.translate(x, y); if (angle) ctx.rotate(angle);
  ctx.drawImage(r.cnv, -r.w / 2 * sc, -r.h / 2 * sc, r.w * sc, r.h * sc);
  ctx.restore();
}
function tileX(name, y, h, vl, vr, ps) {
  const r = raster(name, ps); if (!r) return;
  const w = r.w * (h / r.h);
  for (let x = Math.floor(vl / w) * w; x < vr; x += w) ctx.drawImage(r.cnv, x, y, w + 0.5, h);
}
function drawStand(s, ps) {
  const L = s.cx - s.w / 2, R = s.cx + s.w / 2, top = s.top;
  const cols = s.w > 200 ? [L + 34, R - 34] : [s.cx];
  const col = raster("column", ps);
  for (const x of cols) {
    const h = GROUND - (top + 26);
    if (col) ctx.drawImage(col.cnv, 0, 0, col.cnv.width, Math.min(col.cnv.height, h * col.cnv.height / col.h), x - 13, top + 26, 26, Math.min(col.h, h));
    spr("foot", x - 25, GROUND - 20, 50, 22, ps);
  }
  const m = raster("board_m", ps);
  if (m) {
    ctx.save(); ctx.beginPath(); ctx.rect(L + 17, top - 1, s.w - 34, 32); ctx.clip();
    for (let x = L + 17; x < R - 17; x += 48) ctx.drawImage(m.cnv, x, top, 48.5, 30);
    ctx.restore();
  }
  spr("board_l", L, top, 18, 30, ps); spr("board_r", R - 18, top, 18, 30, ps);
}
function groundShadow(x, bottom, w, alpha = 0.3) {
  const h = GROUND - bottom; if (h > 260 || h < -10) return;
  const k = 1 - Math.max(0, h) / 260;
  ctx.fillStyle = `rgba(14,22,20,${alpha * k})`;
  ctx.beginPath(); ctx.ellipse(x, GROUND + 3, w * 0.55 * (0.6 + 0.4 * k), 5 * k + 2, 0, 0, Math.PI * 2); ctx.fill();
}

const STARS = Array.from({ length: 70 }, (_, i) => ({ x: (i * 397) % 2400 - 600, y: GROUND - 700 - ((i * 211) % 900), r: 0.8 + (i % 3) * 0.6, p: i * 1.7 }));
function draw(now) {
  // ease camera
  const e = 0.12;
  cam.S += (camGoal.S - cam.S) * e; cam.OX += (camGoal.OX - cam.OX) * e; cam.OY += (camGoal.OY - cam.OY) * e;
  const S = cam.S, ps = S * dpr;
  let sx = 0, sy = 0;
  if (shake > 0.4 && !reduceMotion) { sx = rnd(-shake, shake) * 0.6; sy = rnd(-shake, shake) * 0.6; }
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.setTransform(ps, 0, 0, ps, (cam.OX + sx * S) * dpr, (cam.OY + sy * S) * dpr);
  const vl = -cam.OX / S - 40, vr = (cw - cam.OX) / S + 40, vt = -cam.OY / S - 40, vb = (ch - cam.OY) / S + 40, vw = vr - vl;

  // sky
  const sky = ctx.createLinearGradient(0, GROUND - 1150, 0, GROUND - 120);
  sky.addColorStop(0, "#1f1640"); sky.addColorStop(0.35, "#4b2c6e"); sky.addColorStop(0.62, "#a8507a"); sky.addColorStop(0.82, "#e9876f"); sky.addColorStop(1, "#ffcf8f");
  ctx.fillStyle = sky; ctx.fillRect(vl, vt, vw, vb - vt);
  for (const st of STARS) {
    if (st.x < vl || st.x > vr || st.y < vt) continue;
    ctx.fillStyle = `rgba(255,244,226,${0.25 + 0.35 * (0.5 + 0.5 * Math.sin(clock * 0.03 + st.p))})`;
    ctx.beginPath(); ctx.arc(st.x, st.y, st.r, 0, Math.PI * 2); ctx.fill();
  }
  // sun + far layer
  spr("sun", vl + vw * 0.7 - 150, GROUND - 520, 300, 300, ps);
  tileX("far", GROUND - 400, 420, vl, vr, ps);
  // ferris wheel (turns slowly, gondolas hang level)
  const wx = vl + vw * 0.2, wy = GROUND - 400, rot = clock * 0.0025;
  spr("wheel_legs", wx - 150, wy, 300, 380, ps);
  const wr = raster("wheel", ps);
  if (wr) { ctx.save(); ctx.translate(wx, wy); ctx.rotate(rot); ctx.drawImage(wr.cnv, -180, -180, 360, 360); ctx.restore(); }
  for (let i = 0; i < 8; i++) { const a = rot + i * Math.PI / 4; spr("gondola", wx + Math.cos(a) * 166 - 15, wy + Math.sin(a) * 166 - 2, 30, 30, ps); }
  // near layer + ground
  tileX("near", GROUND - 206, 220, vl, vr, ps);
  ctx.fillStyle = "#2e5a46"; ctx.fillRect(vl, GROUND + 150, vw, Math.max(0, vb - GROUND - 150));
  tileX("ground", GROUND - 10, 200, vl, vr, ps);
  // bunting + bulbs hang from the top of the view
  const bt = vt + 40 + 64 / S;
  tileX("bunting", bt, 160, vl, vr, ps);
  for (let x = Math.floor(vl / 30) * 30; x < vr; x += 30) {
    const u = ((x % 720) + 720) % 720 / 720, y = bt + 160 + 30 * Math.sin(u * Math.PI);
    const tw = 0.55 + 0.45 * Math.sin(clock * 0.05 + x * 0.13);
    ctx.fillStyle = `rgba(255,214,140,${0.18 * tw})`; ctx.beginPath(); ctx.arc(x, y, 9, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = `rgba(255,236,190,${0.6 + 0.4 * tw})`; ctx.beginPath(); ctx.arc(x, y, 3, 0, Math.PI * 2); ctx.fill();
  }

  if (level) {
    // shadows
    for (const s of stands) { const cols = s.w > 200 ? [s.cx - s.w / 2 + 34, s.cx + s.w / 2 - 34] : [s.cx]; for (const x of cols) groundShadow(x, GROUND, 60, 0.35); }
    for (const b of bodies) if (!b.gone) groundShadow(b.position.x, b.bounds.max.y, b.w || 40);
    for (const b of balls) if (!b.gone) groundShadow(b.position.x, b.bounds.max.y, 30, 0.35);
    groundShadow(PIVOT.x, GROUND, 110, 0.4);
    for (const s of stands) drawStand(s, ps);
    for (const b of bodies) if (!b.gone) drawSprite(b.sprite, b.position.x, b.position.y, b.angle, ps);
    // ball trails + balls
    for (const b of balls) {
      if (b.gone || b.trail.length < 2) continue;
      const sp = Body.getSpeed(b); if (sp < 6) continue;
      for (let i = 1; i < b.trail.length; i++) {
        const k = i / b.trail.length;
        ctx.strokeStyle = `rgba(255,244,226,${0.35 * k * Math.min(1, (sp - 6) / 8)})`;
        ctx.lineWidth = BALL_R * 1.6 * k; ctx.lineCap = "round";
        ctx.beginPath(); ctx.moveTo(b.trail[i - 1].x, b.trail[i - 1].y); ctx.lineTo(b.trail[i].x, b.trail[i].y); ctx.stroke();
      }
    }
    for (const b of balls) if (!b.gone) drawSprite("ball", b.position.x, b.position.y, b.angle, ps, (BALL_R * 2 + 4) / 34);

    // aim guide
    const showAim = state === "play" && ballsLeft > 0 && (pressing != null || pointerIn || COARSE);
    if (showAim) {
      const m = muzzleAt(aim.angle);
      let x = m.x, y = m.y, vx = Math.cos(aim.angle) * V, vy = Math.sin(aim.angle) * V;
      const reach = Math.max(120, aim.x - m.x) * 1.25 + 30;
      const phase = (clock * 0.6) % 22;
      let dist = 0, lx = x, ly = y;
      for (let i = 0; i < 260; i++) {
        x += vx * 0.25; y += vy * 0.25; vy += G * 0.25;
        dist += Math.hypot(x - lx, y - ly); lx = x; ly = y;
        if (y > GROUND || x - m.x > reach) break;
        const dd = (dist - phase) % 22;
        if (dd < 0 || dd > 2.2) continue;
        const k = Math.min(1, (reach - (x - m.x)) / 90);
        ctx.fillStyle = `rgba(255,244,226,${0.9 * k})`;
        ctx.beginPath(); ctx.arc(x, y, 4.2, 0, Math.PI * 2); ctx.fill();
      }
      // reticle
      const pulse = 1 + 0.08 * Math.sin(clock * 0.15);
      ctx.save(); ctx.translate(aim.x, aim.y); ctx.scale(pulse, pulse);
      ctx.strokeStyle = "rgba(29,21,48,.55)"; ctx.lineWidth = 6;
      ctx.beginPath(); ctx.arc(0, 0, 16, 0, Math.PI * 2); ctx.stroke();
      ctx.strokeStyle = "#ffd66b"; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(0, 0, 16, 0, Math.PI * 2); ctx.stroke();
      ctx.lineCap = "round";
      for (let i = 0; i < 4; i++) { ctx.rotate(Math.PI / 2); ctx.beginPath(); ctx.moveTo(10, 0); ctx.lineTo(22, 0); ctx.stroke(); }
      ctx.fillStyle = "#ffd66b"; ctx.beginPath(); ctx.arc(0, 0, 2.5, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    }

    // cannon
    ctx.save(); ctx.translate(PIVOT.x, PIVOT.y); ctx.rotate(barrelAngle);
    const br = raster("barrel", ps); if (br) ctx.drawImage(br.cnv, -24.5 - recoil, -24.5, br.w, br.h);
    if (flashT > 0) { ctx.globalAlpha = Math.min(1, flashT * 1.4); const f = raster("flash", ps); const s = 0.7 + (1 - flashT) * 0.6; if (f) ctx.drawImage(f.cnv, MUZZLE - 6 - 45 * s, -45 * s, 90 * s, 90 * s); ctx.globalAlpha = 1; }
    ctx.restore();
    spr("carriage", PIVOT.x - 50, GROUND - 71, 101, 75, ps);
    // ammo on the ground beside the cannon
    for (let i = 0; i < ballsLeft; i++) drawSprite("ball_icon", PIVOT.x - 70 - (i % 3) * 22 + (i >= 3 ? 11 : 0), GROUND - 12 - (i >= 3 ? 19 : 0), 0, ps, 0.68);
  }

  // particles
  for (const p of particles) {
    const k = p.life / p.max;
    if (p.type === "smoke") { ctx.fillStyle = `rgba(232,216,232,${0.42 * (1 - k)})`; ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill(); }
    else if (p.type === "dust") { ctx.globalAlpha = 0.5 * (1 - k); drawSprite("puff", p.x, p.y, 0, ps, p.r / 20); ctx.globalAlpha = 1; }
    else if (p.type === "fire") { ctx.fillStyle = k < 0.35 ? `rgba(255,224,140,${1 - k})` : `rgba(216,67,90,${1 - k})`; ctx.beginPath(); ctx.arc(p.x, p.y, p.r * (1 - k * 0.5), 0, Math.PI * 2); ctx.fill(); }
    else if (p.type === "ring") { ctx.strokeStyle = `rgba(255,240,200,${0.7 * (1 - k)})`; ctx.lineWidth = 8 * (1 - k) + 1; ctx.beginPath(); ctx.arc(p.x, p.y, p.r + k * 170, 0, Math.PI * 2); ctx.stroke(); }
    else if (p.type === "spark") { ctx.fillStyle = `rgba(255,214,107,${1 - k})`; ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill(); }
    else { ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot || 0); ctx.globalAlpha = Math.min(1, (1 - k) * 2); ctx.fillStyle = p.c; if (p.type === "confetti") ctx.scale(1, Math.cos(p.life * 0.2 + p.rot)); ctx.fillRect(-p.r / 2, -p.r / 2, p.r, p.type === "confetti" ? p.r * 0.6 : p.r / 2); ctx.restore(); }
  }
  // score popups
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  for (const p of popups) {
    const k = p.life / p.max, s = k < 0.15 ? 0.6 + k / 0.15 * 0.5 : 1.1 - Math.min(0.1, (k - 0.15));
    ctx.save(); ctx.translate(p.x, p.y); ctx.scale(s, s); ctx.globalAlpha = k > 0.7 ? (1 - k) / 0.3 : 1;
    ctx.font = '26px "Bowlby One", Impact, sans-serif';
    ctx.lineWidth = 6; ctx.strokeStyle = "#1d1530"; ctx.strokeText(p.text, 0, 0);
    ctx.fillStyle = "#ffd66b"; ctx.fillText(p.text, 0, 0);
    if (p.sub) { ctx.font = '15px "Bowlby One", Impact, sans-serif'; ctx.lineWidth = 4; ctx.strokeText(p.sub, 0, 22); ctx.fillStyle = "#ff8a8a"; ctx.fillText(p.sub, 0, 22); }
    ctx.restore();
  }

  // screen-space: explosion flash + vignette
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const vg = ctx.createRadialGradient(cw / 2, ch * 0.55, Math.min(cw, ch) * 0.35, cw / 2, ch * 0.55, Math.max(cw, ch) * 0.8);
  vg.addColorStop(0, "rgba(20,12,36,0)"); vg.addColorStop(1, "rgba(20,12,36,0.45)");
  ctx.fillStyle = vg; ctx.fillRect(0, 0, cw, ch);
}

// ================= loop =================
let acc = 0, lastT = performance.now();
function frame(now) {
  acc += Math.min(100, now - lastT); lastT = now;
  let n = 0;
  while (acc >= 1000 / 60 && n < 4) { clock++; if (state !== "title" && state !== "result") step(now); else if (state === "result") stepLite(); acc -= 1000 / 60; n++; }
  draw(now);
  requestAnimationFrame(frame);
}
function stepLite() {   // keep confetti and physics settling behind the result card
  Engine.update(engine, 1000 / 120); Engine.update(engine, 1000 / 120);
  for (let i = particles.length - 1; i >= 0; i--) { const p = particles[i]; p.life++; p.x += p.vx || 0; p.y += p.vy || 0; if (p.type === "confetti") { p.vx += Math.sin((p.life + i) * 0.1) * 0.05; p.rot += p.vr; } if (p.life > p.max) particles.splice(i, 1); }
  for (let i = popups.length - 1; i >= 0; i--) { const p = popups[i]; p.life++; p.y -= 0.9; if (p.life > p.max) popups.splice(i, 1); }
}

window.TOPPLE = { engine, aim, setAimPoint, fire: () => fire(), loadLevel, step, get balls() { return balls; }, get targets() { return targets; }, get state() { return state; }, set state(v) { state = v; }, set lastFire(v) { lastFire = v; } };
function start(data) {
  resize();
  loadSprites().then(() => {
    $("loading").hidden = true; $("btnPlay").hidden = false;
    renderGrid();
    loadLevel(nextLevel(), true);
    if (data && Number.isInteger(data.level)) startLevel(Math.min(LEVELS.length - 1, data.level));
    requestAnimationFrame(frame);
  });
}
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
})();

</script>
